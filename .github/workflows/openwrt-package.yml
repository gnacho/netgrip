name: openwrt-package

# Builds the OpenWrt packages for NetGrip and attaches them to the release:
# .ipk (24.10 SDK) and .apk (25.12 SDK), for aarch64_cortex-a53
# (covers qualcommax/ipq807x and mediatek/filogic routers) and x86_64.
#
# Triggered on v* tag pushes only: every release path (CLI, UI, workflow)
# creates the tag, and the tag push is the one event that always fires
# even when the release is published by another workflow with GITHUB_TOKEN
# (release events are not). The workflow creates the release itself when
# missing, so it needs no assets waiting. A concurrency group serializes
# any residual double-fire for the same tag so uploads never race (#214).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v0.1.6)'
        required: true

concurrency:
  group: openwrt-package-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Los jobs de empaquetado suben en paralelo: la release debe existir
          # ANTES (antes se creaba a mano y el primer job en llegar moría 404).
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes

  package:
    needs: create-release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk-version: 24.10.5
            sdk-target: qualcommax/ipq807x
            format: ipk
            arch: arm64
            goarch: arm64
            pkgarch: aarch64_cortex-a53
            upload-binary: false
          - sdk-version: 25.12.5
            sdk-target: qualcommax/ipq807x
            format: apk
            arch: arm64
            goarch: arm64
            upload-binary: true
          - sdk-version: 24.10.5
            sdk-target: x86/64
            format: ipk
            arch: amd64
            goarch: amd64
            pkgarch: x86_64
            upload-binary: false
          - sdk-version: 25.12.5
            sdk-target: x86/64
            format: apk
            arch: amd64
            goarch: amd64
            upload-binary: true
          - sdk-version: 24.10.5
            sdk-target: ramips/mt7621
            format: ipk
            arch: mipsle
            goarch: mipsle
            pkgarch: mipsel_24kc
            upload-binary: true
          - sdk-version: 24.10.5
            sdk-target: ipq40xx/generic
            format: ipk
            arch: armv7
            goarch: arm
            pkgarch: arm_cortex-a7_neon-vfpv4
            upload-binary: true
          - sdk-version: 25.12.5
            sdk-target: ipq40xx/generic
            format: apk
            arch: armv7
            goarch: arm
            pkgarch: arm_cortex-a7_neon-vfpv4
            upload-binary: false

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: app

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Cross-compile netgrip (${{ matrix.arch }})
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # armv7 (ipq40xx) needs GOARM=7; mips needs soft-float. Other arches
          # ignore both (GOMIPS only affects mips, GOARM only arm).
          if [ "${{ matrix.goarch }}" = "arm" ]; then
            export GOARM=7
          else
            export GOMIPS=softfloat
          fi
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build \
            -ldflags "-s -w -X main.version=${TAG}" -o /tmp/netgrip ./cmd/netgrip
          ls -la /tmp/netgrip
          file /tmp/netgrip

      - name: Package ${{ matrix.format }} (SDK ${{ matrix.sdk-version }})
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PKG_ARCH: ${{ matrix.pkgarch }}
        run: |
          chmod +x deploy/openwrt/package.sh
          export PKG_VERSION="${TAG#v}"
          export PKG_RELEASE="1"
          deploy/openwrt/package.sh \
            "${{ matrix.sdk-version }}" \
            "${{ matrix.sdk-target }}" \
            "" \
            "${{ matrix.format }}" \
            /tmp/netgrip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "Packages generated:"
          ls -la dist/packages/
          # Rename APK to include arch to avoid clobber between arm64 and amd64
          for apk in dist/packages/*.apk; do
            [ -f "$apk" ] || continue
            base="$(basename "$apk" .apk)"
            newname="${base}-${{ matrix.arch }}.apk"
            mv "$apk" "dist/packages/$newname"
            echo "Renamed: $newname"
          done
          gh release upload "$TAG" dist/packages/*.${{ matrix.format }} --clobber
          # Binary artifact for manual deploys; the OpenWrt package is
          # still the recommended install path because it survives sysupgrade.
          # Only ONE job per arch uploads it: apk and ipk jobs of the same
          # arch would race the upload and the loser dies with 422 even
          # with --clobber (check-then-put is not atomic).
          if [ "${{ matrix.upload-binary }}" = "true" ]; then
            cp /tmp/netgrip /tmp/netgrip-linux-${{ matrix.arch }}
            gh release upload "$TAG" /tmp/netgrip-linux-${{ matrix.arch }} --clobber
          fi

  package-luci:
    needs: create-release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk-version: 24.10.5
            sdk-target: qualcommax/ipq807x
            format: ipk
            arch: arm64
          - sdk-version: 25.12.5
            sdk-target: qualcommax/ipq807x
            format: apk
            arch: arm64
          - sdk-version: 24.10.5
            sdk-target: x86/64
            format: ipk
            arch: amd64
          - sdk-version: 25.12.5
            sdk-target: x86/64
            format: apk
            arch: amd64
          - sdk-version: 24.10.5
            sdk-target: ipq40xx/generic
            format: ipk
            arch: armv7
          - sdk-version: 25.12.5
            sdk-target: ipq40xx/generic
            format: apk
            arch: armv7

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package luci-app ${{ matrix.format }} (SDK ${{ matrix.sdk-version }})
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          chmod +x deploy/openwrt/package-luci.sh
          export PKG_VERSION="${TAG#v}"
          export PKG_RELEASE="1"
          deploy/openwrt/package-luci.sh \
            "${{ matrix.sdk-version }}" \
            "${{ matrix.sdk-target }}" \
            "" \
            "${{ matrix.format }}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "LuCI packages generated:"
          ls -la dist/packages/
          # The luci-app ipk is arch-all: every 24.10 leg would upload the
          # same filename concurrently and race on the release assets.
          # Upload it once, from the arm64 leg (#214); the other ipk legs
          # (x86_64, mipsel, armv7) skip.
          if [ "${{ matrix.format }}" = "ipk" ] && [ "${{ matrix.arch }}" != "arm64" ]; then
            echo "luci ipk is arch-all; already uploaded by the arm64 leg, skipping."
            exit 0
          fi
          # luci-app is arch-all, but multiple matrix jobs would otherwise upload
          # the same filename; include the target arch to avoid collisions.
          for pkg in dist/packages/*.apk; do
            [ -f "$pkg" ] || continue
            base="$(basename "$pkg" .apk)"
            arch="${{ matrix.arch }}"
            newname="${base}-${arch}.apk"
            mv "$pkg" "dist/packages/$newname"
            echo "Renamed: $newname"
          done
          gh release upload "$TAG" dist/packages/*.${{ matrix.format }} --clobber

  apk-feed:
    needs: [package, package-luci]
    runs-on: ubuntu-24.04
    container:
      # apk index needs apk-tools 3.x to read OpenWrt 25 .apk packages;
      # alpine:3.21 ships 2.14 and fails every package with IO ERROR (#296).
      image: alpine:edge
    if: github.event_name != 'workflow_dispatch' || inputs.version != ''
    permissions:
      contents: write
      pages: write
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache git nodejs npm openssl curl github-cli zstd tar bash

      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APKs from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p feed
          cd feed
          gh release download "$TAG" --repo ${{ github.repository }} --pattern '*.apk'
          cd ..
          ls -la feed/

      - name: Set up signing key
        env:
          NETGRIP_FEED_KEY: ${{ secrets.NETGRIP_FEED_KEY }}
        run: |
          if [ -z "$NETGRIP_FEED_KEY" ]; then
            echo "::error::NETGRIP_FEED_KEY secret not set. Generate a key with:"
            echo "::error::  usign -G -s netgrip-feed-sec -p deploy/openwrt/keys/netgrip-feed.pub"
            echo "::error::Then add the secret key content as NETGRIP_FEED_KEY in repo secrets."
            exit 1
          fi
          mkdir -p ~/.abuild
          echo "$NETGRIP_FEED_KEY" > ~/.abuild/netgrip-feed-sec
          chmod 600 ~/.abuild/netgrip-feed-sec

      - name: Sign APKs and generate index
        run: |
          chmod +x deploy/openwrt/sign-apk.sh
          # The feed index must be built with the OpenWrt apk-tools: the
          # Alpine one (also 3.x) speaks a different package format and
          # fails on every apk with "file format not supported" (#296).
          SDK_URL_DIR="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/"
          SDK_NAME="$(curl -fsSL "$SDK_URL_DIR" | grep -o 'openwrt-sdk-[^"]*\.tar\.zst' | head -1)"
          curl -fsSL "${SDK_URL_DIR}${SDK_NAME}" -o sdk.tar.zst
          tar --zstd -xf sdk.tar.zst
          export PATH="${PWD}/${SDK_NAME%.tar.zst}/staging_dir/host/bin:$PATH"
          ./deploy/openwrt/sign-apk.sh feed ~/.abuild/netgrip-feed-sec deploy/openwrt/keys/netgrip-feed.pub

      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-feed
          path: feed/

  deploy-feed:
    needs: apk-feed
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - name: Download feed artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-feed
          path: feed/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./feed
          publish_branch: gh-pages
          force_push: true

