name: openwrt-package

# Builds the frontend once, fans it into seven generic Go ABI binaries, then
# packages those binaries with the OpenWrt 24.10 (.ipk) and 25.12 (.apk) SDKs.
#
# Triggered on v* tag pushes only: every release path (CLI, UI, workflow)
# creates the tag, and the tag push is the one event that always fires
# even when the release is published by another workflow with GITHUB_TOKEN
# (release events are not). The workflow creates the release itself when
# missing, so it needs no assets waiting. A concurrency group serializes
# any residual double-fire for the same tag so uploads never race (#214).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v0.1.6)'
        required: true

concurrency:
  group: openwrt-package-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Los jobs de empaquetado suben en paralelo: la release debe existir
          # ANTES (antes se creaba a mano y el primer job en llegar moría 404).
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes

  frontend:
    needs: [create-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build frontend once
        working-directory: app
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/server/dist/
          if-no-files-found: error
      # #592: el paquete del feed oficial de OpenWrt compila el Go desde el
      # tarball de código y descarga el frontend como asset aparte, con hash
      # fijado (mismo patrón que adguardhome, que no lleva Node en el
      # buildroot). El empaquetado es determinista para que el hash del
      # Makefile no cambie entre builds.
      - name: Pack frontend for the feed package
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          chmod +x deploy/pack-frontend.sh
          deploy/pack-frontend.sh "${TAG#v}" "dist/netgrip-frontend-${TAG#v}.tar.gz"
      - name: Upload frontend asset to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release upload "$TAG" "dist/netgrip-frontend-${TAG#v}.tar.gz" --clobber

  binaries:
    needs: [create-release, frontend]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - linux-armv7
          - linux-armv6
          - linux-armv5
          - linux-mipsle
          - linux-mips
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/server/dist
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Build ${{ matrix.target }}
        env:
          VERSION: ${{ needs.create-release.outputs.tag }}
        run: sh deploy/build-binaries.sh "${{ matrix.target }}"
      - name: Install UPX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          upx --version | head -2
      # #586: el binario se publica empaquetado. UPX comprime el ejecutable y el
      # stub lo descomprime en memoria al arrancar: 13.4 MB de flash pasan a 3.9
      # en arm64, sin perder ninguna función. Va ANTES de firmar, porque la firma
      # tiene que cubrir los bytes que se descarga el self-update. El crudo se
      # conserva como asset -raw para depurar (gdb ve el stub, no el binario).
      - name: Pack binary (UPX)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          bin="dist/netgrip-$TARGET"
          cp "$bin" "$bin.raw"
          if upx --best --lzma "$bin" && upx -t "$bin" >/dev/null; then
            raw=$(stat -c %s "$bin.raw")
            packed=$(stat -c %s "$bin")
            echo "| netgrip-$TARGET | $raw | $packed | $((packed * 100 / raw))% |" >> "$GITHUB_STEP_SUMMARY"
          else
            # UPX no cubre todas las arquitecturas ELF: sin soporte se publica
            # el binario tal cual, que es lo que se hacía antes.
            echo "netgrip-$TARGET: UPX no soporta esta arquitectura, se publica sin empaquetar" >&2
            cp "$bin.raw" "$bin"
          fi
      - name: Sign binary
        env:
          NETGRIP_RELEASE_KEY: ${{ secrets.NETGRIP_RELEASE_KEY }}
        run: go run deploy/sign-release.go "dist/netgrip-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: netgrip-binary-${{ matrix.target }}
          path: |
            dist/netgrip-${{ matrix.target }}
            dist/netgrip-${{ matrix.target }}.raw
          if-no-files-found: error
      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release upload "$TAG" "dist/netgrip-${{ matrix.target }}" --clobber
          gh release upload "$TAG" "dist/netgrip-${{ matrix.target }}.sha256" "dist/netgrip-${{ matrix.target }}.sha256.sig" --clobber
          # Crudo sin firmar: no es una vía de actualización, es material de
          # depuración. El self-update solo busca el nombre sin sufijo.
          gh release upload "$TAG" "dist/netgrip-${{ matrix.target }}.raw" --clobber

  size-report:
    needs: [frontend, binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: netgrip-binary-*
          path: binaries
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend
      - name: Write size report
        run: |
          frontend_bytes=$(find frontend -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')
          human() { numfmt --to=iec --suffix=B "$1"; }
          {
            echo "## Release size report"
            echo
            echo "| Asset | Go/server | Frontend | Total |"
            echo "| --- | ---: | ---: | ---: |"
            for binary in binaries/netgrip-linux-*; do
              case "$binary" in *.raw) continue;; esac
              total_bytes=$(stat -c %s "$binary")
              core_bytes=$((total_bytes - frontend_bytes))
              echo "| $(basename "$binary") | $(human "$core_bytes") | $(human "$frontend_bytes") | $(human "$total_bytes") |"
            done
            echo
            echo 'Sizes above are the unpacked build. Release assets ship UPX-packed at 29-33% of that, and the unpacked binary is also published with a .raw suffix for debugging.'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: [create-release, binaries]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk-version: 24.10.5
            sdk-target: qualcommax/ipq807x
            format: ipk
            binary: linux-arm64
            pkgarch: aarch64_cortex-a53
          - sdk-version: 25.12.5
            sdk-target: qualcommax/ipq807x
            format: apk
            binary: linux-arm64
            pkgarch: aarch64_cortex-a53
            asset-suffix: aarch64_cortex-a53
            # Older heal scripts and self-update checks look for the generic
            # Go ABI suffix on this leg (#809).
            legacy-suffix: arm64
          - sdk-version: 25.12.5
            sdk-target: bcm27xx/bcm2711
            format: apk
            binary: linux-arm64
            pkgarch: aarch64_cortex-a72
            asset-suffix: aarch64_cortex-a72
          - sdk-version: 25.12.5
            sdk-target: bcm27xx/bcm2712
            format: apk
            binary: linux-arm64
            pkgarch: aarch64_cortex-a76
            asset-suffix: aarch64_cortex-a76
          - sdk-version: 25.12.5
            sdk-target: armsr/armv8
            format: apk
            binary: linux-arm64
            pkgarch: aarch64_generic
            asset-suffix: aarch64_generic
          - sdk-version: 24.10.5
            sdk-target: x86/64
            format: ipk
            binary: linux-amd64
            pkgarch: x86_64
          - sdk-version: 25.12.5
            sdk-target: x86/64
            format: apk
            binary: linux-amd64
            pkgarch: x86_64
          - sdk-version: 24.10.5
            sdk-target: ramips/mt7621
            format: ipk
            binary: linux-mipsle
            pkgarch: mipsel_24kc
          - sdk-version: 25.12.5
            sdk-target: ramips/mt7621
            format: apk
            binary: linux-mipsle
            pkgarch: mipsel_24kc
          - sdk-version: 24.10.5
            sdk-target: ath79/generic
            format: ipk
            binary: linux-mips
            pkgarch: mips_24kc
          - sdk-version: 25.12.5
            sdk-target: ath79/generic
            format: apk
            binary: linux-mips
            pkgarch: mips_24kc
          - sdk-version: 24.10.5
            sdk-target: ipq40xx/generic
            format: ipk
            binary: linux-armv7
            pkgarch: arm_cortex-a7_neon-vfpv4
          - sdk-version: 25.12.5
            sdk-target: ipq40xx/generic
            format: apk
            binary: linux-armv7
            pkgarch: arm_cortex-a7_neon-vfpv4
          - sdk-version: 24.10.5
            sdk-target: mvebu/cortexa9
            format: ipk
            binary: linux-armv7
            pkgarch: arm_cortex-a9_vfpv3-d16
          - sdk-version: 25.12.5
            sdk-target: mvebu/cortexa9
            format: apk
            binary: linux-armv7
            pkgarch: arm_cortex-a9_vfpv3-d16
            asset-suffix: arm_cortex-a9_vfpv3-d16
          - sdk-version: 24.10.5
            sdk-target: bcm53xx/generic
            format: ipk
            binary: linux-armv7
            pkgarch: arm_cortex-a9
          - sdk-version: 25.12.5
            sdk-target: bcm53xx/generic
            format: apk
            binary: linux-armv7
            pkgarch: arm_cortex-a9
            asset-suffix: arm_cortex-a9
          - sdk-version: 24.10.5
            sdk-target: bcm27xx/bcm2708
            format: ipk
            binary: linux-armv6
            pkgarch: arm_arm1176jzf-s_vfp
          - sdk-version: 25.12.5
            sdk-target: bcm27xx/bcm2708
            format: apk
            binary: linux-armv6
            pkgarch: arm_arm1176jzf-s_vfp
          - sdk-version: 24.10.5
            sdk-target: kirkwood/generic
            format: ipk
            binary: linux-armv5
            pkgarch: arm_xscale
          - sdk-version: 25.12.5
            sdk-target: kirkwood/generic
            format: apk
            binary: linux-armv5
            pkgarch: arm_xscale

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: netgrip-binary-${{ matrix.binary }}
          path: /tmp/netgrip-binary
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Package ${{ matrix.format }} (SDK ${{ matrix.sdk-version }})
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
          PKG_ARCH: ${{ matrix.pkgarch }}
        run: |
          chmod +x deploy/openwrt/package.sh
          export PKG_VERSION="${TAG#v}"
          export PKG_RELEASE="1"
          deploy/openwrt/package.sh \
            "${{ matrix.sdk-version }}" \
            "${{ matrix.sdk-target }}" \
            "" \
            "${{ matrix.format }}" \
            "/tmp/netgrip-binary/netgrip-${{ matrix.binary }}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETGRIP_RELEASE_KEY: ${{ secrets.NETGRIP_RELEASE_KEY }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          echo "Packages generated:"
          ls -la dist/packages/
          # Preserve generic names for existing heal scripts; new targets use native names.
          for apk in dist/packages/*.apk; do
            [ -f "$apk" ] || continue
            base="$(basename "$apk" .apk)"
            asset_arch="${{ matrix.asset-suffix || matrix.binary }}"
            asset_arch="${asset_arch#linux-}"
            newname="${base}-${asset_arch}.apk"
            mv "$apk" "dist/packages/$newname"
            echo "Renamed: $newname"
          done
          # Sign every package with the release key: the self-update verifies
          # the .apk against this digest before handing it to apk (#809).
          for apk in dist/packages/*.apk; do
            [ -f "$apk" ] || continue
            go run deploy/sign-release.go "$apk"
          done
          gh release upload "$TAG" dist/packages/*.${{ matrix.format }} --clobber
          gh release upload "$TAG" dist/packages/*.apk.sha256 dist/packages/*.apk.sha256.sig --clobber

      # The native asset name is the package architecture. Keep the old
      # generic ABI name as an alias so devices running an older heal script
      # can still resolve the asset (#809).
      - name: Upload legacy arch alias
        if: matrix.format == 'apk' && matrix.legacy-suffix != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -eu
          native_n="${{ matrix.asset-suffix }}"
          legacy_n="${{ matrix.legacy-suffix }}"
          for apk in dist/packages/*-"$native_n".apk; do
            [ -f "$apk" ] || continue
            base="$(basename "$apk" .apk)"
            alias_name="$(basename "$base" -"${native_n}")-${legacy_n}.apk"
            cp "$apk" "dist/packages/$alias_name"
            cp "$apk.sha256" "dist/packages/$alias_name.sha256"
            cp "$apk.sha256.sig" "dist/packages/$alias_name.sha256.sig"
            echo "Alias: $alias_name"
          done
          gh release upload "$TAG" dist/packages/*-"$legacy_n".apk \
            dist/packages/*-"$legacy_n".apk.sha256 \
            dist/packages/*-"$legacy_n".apk.sha256.sig --clobber

  apk-feed:
    needs: package
    runs-on: ubuntu-24.04
    container:
      # apk index needs apk-tools 3.x to read OpenWrt 25 .apk packages;
      # alpine:3.21 ships 2.14 and fails every package with IO ERROR (#296).
      image: alpine:edge
    if: github.event_name != 'workflow_dispatch' || inputs.version != ''
    permissions:
      contents: write
      pages: write
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache git nodejs npm openssl curl github-cli jq zstd tar bash

      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets for Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p feed
          cd feed
          gh release download "$TAG" --repo ${{ github.repository }} --pattern '*.apk' --pattern 'netgrip-linux-*'
          rm -f ./*.raw
          cd ..
          ls -la feed/

      - name: Generate self-update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: sh deploy/openwrt/pages-manifest.sh "$TAG" feed/latest.json

      - name: Set up signing key
        env:
          NETGRIP_FEED_KEY: ${{ secrets.NETGRIP_FEED_KEY }}
        run: |
          if [ -z "$NETGRIP_FEED_KEY" ]; then
            echo "::error::NETGRIP_FEED_KEY secret not set. Generate an EC P-256 key with:"
            echo "::error::  openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out netgrip-feed-key.pem"
            echo "::error::  openssl pkey -in netgrip-feed-key.pem -pubout -out deploy/openwrt/keys/netgrip-feed.pem"
            echo "::error::Then add the private key content as NETGRIP_FEED_KEY in repo secrets."
            exit 1
          fi
          mkdir -p ~/.abuild
          printf '%s\n' "$NETGRIP_FEED_KEY" > ~/.abuild/netgrip-feed-key.pem
          chmod 600 ~/.abuild/netgrip-feed-key.pem

      - name: Sign APKs and generate index
        run: |
          chmod +x deploy/openwrt/sign-apk.sh
          # The feed must be built with the OpenWrt apk-tools: the Alpine
          # build refuses these packages, and a v3 index has to be signed with
          # apk itself, not with usign (#296, #582).
          SDK_URL_DIR="https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/"
          SDK_NAME="$(curl -fsSL "$SDK_URL_DIR" | grep -o 'openwrt-sdk-[^"]*\.tar\.zst' | head -1)"
          curl -fsSL "${SDK_URL_DIR}${SDK_NAME}" -o sdk.tar.zst
          tar --zstd -xf sdk.tar.zst
          export PATH="${PWD}/${SDK_NAME%.tar.zst}/staging_dir/host/bin:$PATH"
          ./deploy/openwrt/sign-apk.sh feed ~/.abuild/netgrip-feed-key.pem deploy/openwrt/keys/netgrip-feed.pem

      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-feed
          path: feed/

  deploy-feed:
    needs: apk-feed
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - name: Download feed artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-feed
          path: feed/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./feed
          publish_branch: gh-pages
