name: openwrt-package

# Builds the OpenWrt packages for NetGrip and attaches them to the release:
# .ipk (24.10 SDK) and .apk (25.12 SDK), for aarch64_cortex-a53
# (covers qualcommax/ipq807x and mediatek/filogic routers) and x86_64.
#
# Triggered on v* tag pushes (the same event as any release workflow).
# The `release` event is NOT reliable for releases published by another
# workflow (GITHUB_TOKEN events do not start new runs), so this workflow
# builds the frontend and the binary itself and needs no assets waiting.

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v0.1.6)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Los jobs de empaquetado suben en paralelo: la release debe existir
          # ANTES (antes se creaba a mano y el primer job en llegar moría 404).
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes

  package:
    needs: create-release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk-version: 24.10.5
            sdk-target: qualcommax/ipq807x
            format: ipk
            arch: arm64
            goarch: arm64
          - sdk-version: 25.12.5
            sdk-target: qualcommax/ipq807x
            format: apk
            arch: arm64
            goarch: arm64
          - sdk-version: 24.10.5
            sdk-target: x86/64
            format: ipk
            arch: amd64
            goarch: amd64
          - sdk-version: 25.12.5
            sdk-target: x86/64
            format: apk
            arch: amd64
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: app

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Cross-compile netgrip (${{ matrix.arch }})
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build \
            -ldflags "-s -w -X main.version=${TAG}" -o /tmp/netgrip ./cmd/netgrip
          ls -la /tmp/netgrip
          file /tmp/netgrip

      - name: Package ${{ matrix.format }} (SDK ${{ matrix.sdk-version }})
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          chmod +x deploy/openwrt/package.sh
          export PKG_VERSION="${TAG#v}"
          export PKG_RELEASE="1"
          deploy/openwrt/package.sh \
            "${{ matrix.sdk-version }}" \
            "${{ matrix.sdk-target }}" \
            "" \
            "${{ matrix.format }}" \
            /tmp/netgrip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "Packages generated:"
          ls -la dist/packages/
          # Rename APK to include arch to avoid clobber between arm64 and amd64
          for apk in dist/packages/*.apk; do
            [ -f "$apk" ] || continue
            base="$(basename "$apk" .apk)"
            newname="${base}-${{ matrix.arch }}.apk"
            mv "$apk" "dist/packages/$newname"
            echo "Renamed: $newname"
          done
          gh release upload "$TAG" dist/packages/*.${{ matrix.format }} --clobber
          # Binary artifact for manual deploys; the OpenWrt package is
          # still the recommended install path because it survives sysupgrade.
          cp /tmp/netgrip /tmp/netgrip-linux-${{ matrix.arch }}
          gh release upload "$TAG" /tmp/netgrip-linux-${{ matrix.arch }} --clobber

  package-luci:
    needs: create-release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk-version: 24.10.5
            sdk-target: qualcommax/ipq807x
            format: ipk
          - sdk-version: 25.12.5
            sdk-target: qualcommax/ipq807x
            format: apk
          - sdk-version: 24.10.5
            sdk-target: x86/64
            format: ipk
          - sdk-version: 25.12.5
            sdk-target: x86/64
            format: apk

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package luci-app ${{ matrix.format }} (SDK ${{ matrix.sdk-version }})
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          chmod +x deploy/openwrt/package-luci.sh
          export PKG_VERSION="${TAG#v}"
          export PKG_RELEASE="1"
          deploy/openwrt/package-luci.sh \
            "${{ matrix.sdk-version }}" \
            "${{ matrix.sdk-target }}" \
            "" \
            "${{ matrix.format }}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "LuCI packages generated:"
          ls -la dist/packages/
          gh release upload "$TAG" dist/packages/*.${{ matrix.format }} --clobber

  apk-feed:
    needs: [package, package-luci]
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.20
    if: github.event_name != 'workflow_dispatch' || inputs.version != ''
    permissions:
      contents: write
      pages: write
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache git nodejs npm openssl abuild apk-tools curl github-cli

      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APKs from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p feed
          cd feed
          gh release download "$TAG" --repo ${{ github.repository }} --pattern '*.apk'
          cd ..
          ls -la feed/

      - name: Set up signing key
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          if [ -z "$APK_SIGN_KEY" ]; then
            echo "::error::APK_SIGN_KEY secret not set. Generate a key with: abuild-keygen -n"
            echo "::error::Then add the private key content as APK_SIGN_KEY in repo secrets."
            exit 1
          fi
          mkdir -p ~/.abuild
          echo "$APK_SIGN_KEY" > ~/.abuild/netgrip-signing-key.rsa
          chmod 600 ~/.abuild/netgrip-signing-key.rsa

      - name: Sign APKs and generate index
        run: |
          chmod +x deploy/openwrt/sign-apk.sh
          PRIVKEY=~/.abuild/netgrip-signing-key.rsa
          for apk in feed/*.apk; do
            [ -f "$apk" ] || continue
            ./deploy/openwrt/sign-apk.sh "$apk" "$PRIVKEY" feed/
          done

      - name: Extract public key
        run: |
          PRIVKEY=~/.abuild/netgrip-signing-key.rsa
          openssl rsa -in "$PRIVKEY" -pubout -out feed/netgrip.rsa.pub 2>/dev/null

      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-feed
          path: feed/

  deploy-feed:
    needs: apk-feed
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - name: Download feed artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-feed
          path: feed/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./feed
          publish_branch: gh-pages
          force_push: true

