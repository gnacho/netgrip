<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>owpanel spike</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #0b1118; color: #e5edf5; min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem; }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: 1.25rem; margin-bottom: 1rem; }
  .card { background: #131c26; border: 1px solid #22303f; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: #8ba3bb; margin-bottom: 0.75rem; }
  input, button { font: inherit; border-radius: 8px; border: 1px solid #2c3e52; padding: 0.55rem 0.8rem; }
  input { background: #0b1118; color: inherit; width: 100%; margin-bottom: 0.75rem; }
  button { background: #2563eb; color: #fff; border: none; cursor: pointer; }
  button.secondary { background: #22303f; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  td, th { text-align: left; padding: 0.3rem 0.4rem; border-bottom: 1px solid #1e2b3a; }
  th { color: #8ba3bb; font-weight: 500; }
  .err { color: #f87171; margin-bottom: 0.75rem; font-size: 0.9rem; }
  .muted { color: #64748b; font-size: 0.85rem; }
  .row { display: flex; gap: 0.5rem; align-items: center; }
  .grow { flex: 1; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>owpanel <span class="muted">spike</span></h1>

  <section id="login-card" class="card">
    <h2>Login (contraseña root del router)</h2>
    <div id="login-error" class="err hidden"></div>
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="login-btn" class="grow">Entrar</button>
  </section>

  <div id="dashboard" class="hidden">
    <section class="card">
      <h2>Sistema</h2>
      <table id="board-table"></table>
    </section>
    <section class="card">
      <h2>Clientes WiFi</h2>
      <div id="wireless"></div>
    </section>
    <section class="card">
      <h2>Leases DHCP</h2>
      <div id="leases" class="muted"></div>
    </section>
    <div class="row">
      <button id="refresh-btn" class="secondary grow">Refrescar</button>
      <button id="logout-btn" class="secondary">Salir</button>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 401 && path !== "/api/login") { showLogin(); throw new Error("401"); }
  return res;
}

function showLogin() {
  $("dashboard").classList.add("hidden");
  $("login-card").classList.remove("hidden");
}

function showDashboard() {
  $("login-card").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  loadAll();
}

$("login-btn").onclick = async () => {
  $("login-error").classList.add("hidden");
  const res = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: $("password").value }),
  });
  if (res.status === 204) { showDashboard(); return; }
  const data = await res.json().catch(() => ({}));
  $("login-error").textContent = data.error || "Error de login";
  $("login-error").classList.remove("hidden");
};

$("logout-btn").onclick = async () => { await fetch("/api/logout", { method: "POST" }); showLogin(); };
$("refresh-btn").onclick = loadAll;

async function loadAll() {
  loadBoard(); loadWireless(); loadLeases();
}

async function loadBoard() {
  const res = await api("/api/board");
  const b = await res.json();
  const rows = [
    ["Modelo", b.model], ["Hostname", b.hostname],
    ["Firmware", b.release && (b.release.distribution + " " + b.release.version + " r" + b.release.revision)],
    ["Kernel", b.kernel],
  ];
  $("board-table").innerHTML = rows.map(([k, v]) => `<tr><th>${k}</th><td>${v ?? "?"}</td></tr>`).join("");
}

async function loadWireless() {
  const res = await api("/api/wireless");
  const data = await res.json();
  const ifaces = Object.entries(data || {});
  if (!ifaces.length) { $("wireless").innerHTML = '<span class="muted">Sin interfaces hostapd</span>'; return; }
  $("wireless").innerHTML = ifaces.map(([iface, clients]) => {
    const rows = (clients || []).map(c => `<tr><td>${c.mac}</td><td>${c.signal} dBm</td></tr>`).join("");
    return `<p><strong>${iface}</strong> · ${(clients || []).length} cliente(s)</p>` +
      (rows ? `<table>${rows}</table>` : '<p class="muted">sin clientes</p>');
  }).join("");
}

async function loadLeases() {
  const res = await api("/api/leases");
  const leases = await res.json();
  if (!leases || !leases.length) { $("leases").textContent = "Sin leases (dnsmasq no corre en este router)"; return; }
  $("leases").innerHTML = "<table>" + leases.map(l =>
    `<tr><td>${l.ip}</td><td>${l.hostname}</td><td>${l.mac}</td></tr>`).join("") + "</table>";
}
</script>
</body>
</html>
